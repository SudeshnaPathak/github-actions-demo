name: CD Workflow

on: #CD workflow should run on completion of the CI workflow
    workflow_run:
        workflows: ["CI workflow"] # name of the CI workflow
        types: [completed]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4 # clone the code into a ubuntu runner

            - name: Execute remote SSH commands using password
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.EC2_HOST }}
                  username: ${{ secrets.EC2_USER }}
                  key: ${{ secrets.EC2_SSH_KEY }}
                  script: |
                    if [ ! -d "~/github-actions-demo" ]; then
                      git clone https://github.com/SudeshnaPathak/github-actions-demo.git ~/github-actions-demo
                    fi
                    cd ~/github-actions-demo
                    git pull origin main # pull the latest code from the repository
                    docker compose pull # pull the latest image from Docker Hub
                    docker compose down && docker compose up -d # restart the containers with the new image