name: CI workflow

on: 
    push:

jobs:
    build-and-push: #Name of the job
        runs-on: ubuntu-latest #Free Github Runner
        steps:
            - name: Checkout code #Name of the step
              uses: actions/checkout@v4 #clone the code into a ubuntu runner
            - name: Setup Docker
              uses: docker/setup-buildx-action@v4 #Setup docker buildx 

            - name: Push to Docker Hub
              uses: docker/build-push-action@v7

            - uses: docker/login-action@v4 #To authenticate
              with:
                username: ${{ secrets.USERNAME }}
                password: ${{ secrets.ACTIONS }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                context: ./backend
                push: true
                tags: ${{ secrets.USERNAME }}/skillpulse-backend:latest