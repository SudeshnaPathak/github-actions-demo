name: CI workflow

on:
  push:

jobs:
  build-and-push: # job's name
    runs-on: ubuntu-latest # GitHub Runner (free) where the build runs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # clone the code into a ubuntu runner

      - name: Setup Docker
        uses: docker/setup-buildx-action@v4 # Setup docker

      - uses: docker/login-action@v4 # to authenticate
        with:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.ACTIONS }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.USERNAME }}/skillpulse-backend:shyam