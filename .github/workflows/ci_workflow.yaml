name: CI workflow

on: 
    push:

jobs:
    build: #Name of the job
        runs-on: ubuntu-latest #Free Github Runner
        steps:
            - name: Checkout code #Name of the step
              uses: actions/checkout@v4 #clone the code into a ubuntu runner
            - name: Setup Docker
              uses: docker/setup-buildx-action@v4 #Setup docker buildx to build and push multi-arch images